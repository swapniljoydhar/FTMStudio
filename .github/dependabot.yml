version: 2
updates:
  # npm devDependencies (eslint, etc.)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps:"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - ci
    commit-message:
      prefix: "ci:"
    # Constrain to minor/patch only — major bumps for actions/checkout
    # and actions/setup-node are often bogus (e.g. v4→v7 doesn't exist).
    ignore:
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/setup-node"
        update-types: ["version-update:semver-major"]
