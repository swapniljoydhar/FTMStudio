<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>FTM Studio</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">#</span><div><strong>FTM Studio</strong><small id="version-badge"></small></div></div>
      <label class="toggle-label" title="Enable or disable manual conversion"><span>Enabled</span><input id="master-toggle" type="checkbox"><span class="switch" aria-hidden="true"></span></label>
    </header>

    <section class="hero">
      <p class="eyebrow">Private local conversion</p>
      <h1>Files to Markdown</h1>
      <p>Convert on this device. FTM Studio never edits pages, uploads files, or requests website access.</p>
      <button class="primary" id="open-converter" type="button">Open manual converter</button>
    </section>

    <section class="card" aria-labelledby="output-title">
      <div class="section-heading"><h2 id="output-title">Output</h2><span class="save-status" id="save-status" aria-live="polite"></span></div>
      <label class="setting"><span><strong>YAML frontmatter</strong><small>Add source type and conversion metadata.</small></span><input id="yaml-toggle" type="checkbox"></label>
      <label class="setting"><span><strong>Trim trailing whitespace</strong><small>Keep generated Markdown compact.</small></span><input id="trim-whitespace" type="checkbox"></label>
      <label class="setting"><span><strong>Heading hierarchy</strong><small>Normalize heading levels where possible.</small></span><input id="heading-hierarchy" type="checkbox"></label>
    </section>

    <section class="card" aria-labelledby="formats-title">
      <div class="section-heading"><h2 id="formats-title">Formats</h2><span class="muted">Curated for quality and memory use</span></div>
      <div id="format-list" class="format-list"></div>
    </section>

    <section class="card" aria-labelledby="history-title">
      <div class="section-heading"><h2 id="history-title">Recent conversions</h2><div class="actions"><button class="text-button" id="export-history" type="button">Export</button><button class="text-button danger" id="clear-history" type="button">Clear</button></div></div>
      <div id="history-list" class="history-list"><p class="empty">No local conversion history.</p></div>
    </section>

    <footer class="footer"><span>v4 manual workspace</span><a href="https://github.com/swapniljoydhar/FTMStudio" target="_blank" rel="noopener noreferrer">Source</a></footer>
  </main>
  <script src="shared/browser.js"></script>
  <script src="shared/constants.js"></script>
  <script src="shared/text.js"></script>
  <script src="shared/config.js"></script>
  <script src="shared/messages.js"></script>
  <script src="popup.js"></script>
</body>
</html>
