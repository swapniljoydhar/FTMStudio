<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FTM Studio — Offscreen Parser</title>
</head>
<body>
  <!--
    Ephemeral parser host. Receives file bytes as base64 chunks over a
    chrome.runtime port (extension messaging is a JSON channel — ArrayBuffers
    and transfer lists are not supported), parses them with locally bundled
    libraries and returns Markdown. Closed by the service worker once idle.
  -->
  <script src="shared/constants.js"></script>
  <script src="shared/text.js"></script>
  <script src="shared/config.js"></script>
  <script src="offscreen/loader.js"></script>
  <script src="offscreen/documents.js"></script>
  <script src="offscreen/archives.js"></script>
  <script src="offscreen/tabular.js"></script>
  <script src="offscreen.js"></script>
</body>
</html>
